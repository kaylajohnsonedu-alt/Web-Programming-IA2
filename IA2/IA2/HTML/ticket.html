<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Coding Conf Tech Conference 2026</title>
</head>

<body>

    <header>
        <h3>Coding Conf</h3>
    </header>

    <main>

        <section class="ticket">
            <h1>Congrats, <span id="user-name1"></span>! Your ticket is ready</h1>
            <p>We've emailed your ticket to <span id="user-email"></span> and will send updates in the run up to the event.</p>
        </section>

        <section class="ticket">
            <div class="image-container">
                <!-- The background image -->
                <img src="../assets/pattern-ticket.svg" alt="Digital Ticket class="bg-image">

                <!-- The overlay text -->
                <div id="overlay-text" class="text-overlay-bottom">
                    <img src="../assets/image-avatar.jpg">
                    <span id="user-name2"></span>
                    <span id="user-github"></span>
                </div>
            </div>
        </section>

        <div id="profileData"></div>

    </main>

    <script src="../js/ticket.js"></script>

    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>
</html>
